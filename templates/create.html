<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Topic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-4">📝 Create a New Project Topic</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" class="card p-4 shadow-sm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Your Name *</label>
                        <input type="text" class="form-control" name="creator_name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Enrollment Number *</label>
                        <input type="text" class="form-control" name="enrollment_no" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Leader Password *</label>
                    <input type="password" class="form-control" name="leader_password" required>
                    <small class="text-muted">Keep this password safe for leader login.</small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mobile</label>
                        <input type="tel" class="form-control" name="mobile">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Male">
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Female">
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Other">
                        <label class="form-check-label">Other</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Topic Name *</label>
                    <input type="text" class="form-control" name="topic_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="4"></textarea>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="looking" name="looking_for_members" checked>
                    <label class="form-check-label" for="looking">I am looking for team members</label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact (optional)</label>
                    <input type="text" class="form-control" name="creator_contact">
                </div>

                <button class="btn btn-primary">Submit Topic</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
