<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Topic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>✏️ Edit Topic</h1>
        <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">← Back to Admin</a>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" class="card shadow-sm p-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Creator Name *</label>
                <input class="form-control" name="creator_name" value="{{ topic['creator_name'] }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Enrollment Number *</label>
                <input class="form-control" name="enrollment_no" value="{{ topic['enrollment_no'] }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Leader Password</label>
            <input type="password" class="form-control" name="leader_password" placeholder="Leave blank to keep current password">
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ topic['email'] or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Mobile</label>
                <input class="form-control" name="mobile" value="{{ topic['mobile'] or '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender">
                <option value="">Select</option>
                <option value="Male" {% if topic['gender']=='Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if topic['gender']=='Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if topic['gender']=='Other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Topic Name *</label>
            <input class="form-control" name="topic_name" value="{{ topic['topic_name'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4">{{ topic['description'] or '' }}</textarea>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="looking" name="looking_for_members" {% if topic['looking_for_members'] %}checked{% endif %}>
            <label class="form-check-label" for="looking">Accepting new team members</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input class="form-control" name="creator_contact" value="{{ topic['creator_contact'] or '' }}">
        </div>
        <button class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
